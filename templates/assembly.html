<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssemblyAI Real-time Transcription Demo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/assemblyai/3.0.1/assemblyai.min.js"></script>
</head>
<body>
    <h1>AssemblyAI Real-time Transcription</h1>
    <div>
        <button id="startButton">Start Recording</button>
        <button id="stopButton" disabled>Stop Recording</button>
    </div>
    <div>
        <h2>Partial Transcript:</h2>
        <p id="partialTranscript"></p>
        <h2>Final Transcript:</h2>
        <p id="finalTranscript"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startButton = document.getElementById('startButton');
            const stopButton = document.getElementById('stopButton');
            const partialTranscriptElement = document.getElementById('partialTranscript');
            const finalTranscriptElement = document.getElementById('finalTranscript');
            
            let transcriber;
            let mediaRecorder;
            let audioChunks = [];

            startButton.addEventListener('click', async () => {
                try {
                    // Replace with your AssemblyAI API key
                    const apiKey = 'YOUR_API_KEY';
                    const client = new AssemblyAI({ apiKey });
                    
                    // Get user's microphone permission
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // Create the transcriber
                    transcriber = client.realtime.transcriber({
                        sampleRate: 16000
                    });
                    
                    // Set up event listeners
                    transcriber.on('open', ({ sessionId }) => {
                        console.log(`Session opened with ID: ${sessionId}`);
                    });
                    
                    transcriber.on('error', (error) => {
                        console.error('Error:', error);
                    });
                    
                    transcriber.on('close', (code, reason) => {
                        console.log('Session closed:', code, reason);
                    });
                    
                    transcriber.on('transcript', (transcript) => {
                        if (!transcript.text) {
                            return;
                        }
                        
                        if (transcript.message_type === 'PartialTranscript') {
                            partialTranscriptElement.textContent = transcript.text;
                        } else {
                            finalTranscriptElement.textContent += transcript.text + ' ';
                        }
                    });
                    
                    // Connect to the transcriber
                    await transcriber.connect();
                    
                    // Set up media recorder
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.addEventListener('dataavailable', async (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                            
                            // Convert the audio chunk to ArrayBuffer
                            const audioBlob = new Blob([event.data], { type: 'audio/webm' });
                            const arrayBuffer = await audioBlob.arrayBuffer();
                            
                            // Send the audio data to AssemblyAI
                            if (transcriber && transcriber.connected) {
                                transcriber.sendAudio(new Uint8Array(arrayBuffer));
                            }
                        }
                    });
                    
                    // Start recording
                    mediaRecorder.start(100); // Collect 100ms chunks
                    
                    // Update UI
                    startButton.disabled = true;
                    stopButton.disabled = false;
                    
                } catch (error) {
                    console.error('Failed to start recording:', error);
                }
            });
            
            stopButton.addEventListener('click', async () => {
                if (mediaRecorder) {
                    mediaRecorder.stop();
                }
                
                if (transcriber) {
                    await transcriber.close();
                }
                
                // Update UI
                startButton.disabled = false;
                stopButton.disabled = true;
            });
        });
    </script>
</body>
</html>
