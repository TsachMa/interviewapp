<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Interviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .interviews-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .interview-card {
            transition: transform 0.2s;
            cursor: pointer;
        }
        
        .interview-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="container interviews-container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Saved Interviews</h1>
            <a href="/" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> New Interview
            </a>
        </div>
        
        <div id="interviewsList" class="row g-4">
            <!-- Interviews will be loaded here -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading saved interviews...</p>
            </div>
        </div>
        
        <!-- No interviews message (hidden by default) -->
        <div id="noInterviewsMessage" class="text-center py-5 d-none">
            <i class="bi bi-folder-x fs-1 text-muted"></i>
            <h3 class="mt-3">No Saved Interviews</h3>
            <p class="text-muted">Start a new interview to begin tracking your progress.</p>
            <a href="/" class="btn btn-primary mt-3">
                <i class="bi bi-plus-circle"></i> Start New Interview
            </a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const interviewsList = document.getElementById('interviewsList');
            const noInterviewsMessage = document.getElementById('noInterviewsMessage');
            
            // Fetch the list of saved interviews
            fetch('/get_interviews')
                .then(response => response.json())
                .then(data => {
                    // Clear loading spinner
                    interviewsList.innerHTML = '';
                    
                    if (data.success && data.interviews && data.interviews.length > 0) {
                        // Display each interview as a card
                        data.interviews.forEach(interview => {
                            const date = new Date(interview.date_time);
                            const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                            
                            const statusClass = interview.status === 'completed' ? 'bg-success' : 'bg-warning';
                            const statusText = interview.status === 'completed' ? 'Completed' : 'In Progress';
                            
                            const card = document.createElement('div');
                            card.className = 'col-md-6 col-lg-4';
                            card.innerHTML = `
                                <div class="card interview-card position-relative" onclick="viewInterview(${interview.id})">
                                    <span class="badge ${statusClass} status-badge">${statusText}</span>
                                    <div class="card-body">
                                        <h5 class="card-title">${interview.title}</h5>
                                        <p class="card-text text-muted">
                                            <i class="bi bi-calendar"></i> ${formattedDate}
                                        </p>
                                        <div class="d-flex justify-content-between mt-3">
                                            <button class="btn btn-sm btn-outline-primary" onclick="viewInterview(${interview.id}); event.stopPropagation();">
                                                <i class="bi bi-eye"></i> View
                                            </button>
                                            <button class="btn btn-sm btn-outline-danger" onclick="deleteInterview(${interview.id}); event.stopPropagation();">
                                                <i class="bi bi-trash"></i> Delete
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                            
                            interviewsList.appendChild(card);
                        });
                    } else {
                        // Show the "no interviews" message
                        noInterviewsMessage.classList.remove('d-none');
                    }
                })
                .catch(error => {
                    console.error('Error fetching interviews:', error);
                    interviewsList.innerHTML = `
                        <div class="col-12 text-center py-4">
                            <div class="alert alert-danger">
                                <i class="bi bi-exclamation-triangle"></i>
                                Error loading interviews. Please try again.
                            </div>
                        </div>
                    `;
                });
        });
        
        // Function to view an interview
        function viewInterview(id) {
            window.location.href = `/analysis/${id}`;
        }
        
        // Function to delete an interview
        function deleteInterview(id) {
            if (confirm('Are you sure you want to delete this interview? This action cannot be undone.')) {
                fetch(`/delete_interview/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Reload the page to update the list
                        window.location.reload();
                    } else {
                        alert('Error deleting interview: ' + (data.error || 'Unknown error'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting interview. Please try again.');
                });
            }
        }
    </script>
</body>
</html>
