<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .analysis-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .transcript-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: white;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .chat-message {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
        }
        
        .user-message {
            background-color: #e6f2ff;
            border-left: 3px solid #0d6efd;
        }
        
        .assistant-message {
            background-color: #f0f0f0;
            border-left: 3px solid #6c757d;
        }
        
        .analysis-section {
            background-color: #f8f9fa;
            border-left: 4px solid #198754;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .code-snapshot {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            overflow-x: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container analysis-container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Interview Analysis</h1>
            <a href="/" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> Back to Interview
            </a>
        </div>
        
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Performance Summary</h2>
            </div>
            <div class="card-body">
                <div class="analysis-section" id="analysisContent">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>Generating analysis...</p>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Final Code Submission</h2>
            </div>
            <div class="card-body">
                <pre class="code-snapshot" id="finalCode">Loading code...</pre>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Interview Transcript</h2>
            </div>
            <div class="card-body">
                <div class="transcript-container" id="fullTranscript">
                    <!-- Transcript messages will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fullTranscript = document.getElementById('fullTranscript');
            const analysisContent = document.getElementById('analysisContent');
            const finalCode = document.getElementById('finalCode');
            
            // Load the chat history from localStorage
            const chatHistory = JSON.parse(localStorage.getItem('interviewChatHistory') || '[]');
            
            // Load the Python code from localStorage
            const pythonCode = localStorage.getItem('pythonCode') || '';
            
            // Display the Python code
            finalCode.textContent = pythonCode;
            
            // Display the transcript
            if (chatHistory && chatHistory.length > 0) {
                fullTranscript.innerHTML = '';
                chatHistory.forEach(message => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `chat-message ${message.role === 'user' ? 'user-message' : 'assistant-message'}`;
                    
                    // Create header with role and timestamp
                    const header = document.createElement('div');
                    header.className = 'message-header small text-muted';
                    
                    // Format the timestamp
                    const timestamp = new Date(message.timestamp);
                    const timeString = timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    header.textContent = `${message.role === 'user' ? 'You' : 'Interviewer'} - ${timeString}`;
                    
                    // Create content
                    const content = document.createElement('div');
                    content.className = 'message-content';
                    content.textContent = message.text;
                    
                    // Add header and content to message
                    messageDiv.appendChild(header);
                    messageDiv.appendChild(content);
                    
                    // Add message to transcript
                    fullTranscript.appendChild(messageDiv);
                });
            } else {
                fullTranscript.innerHTML = '<p>No transcript available.</p>';
            }
            
            // Format the transcript for sending to the API
            const formattedTranscript = chatHistory.map(msg => 
                `${msg.role === 'user' ? 'User' : 'Interviewer'}: ${msg.text}`
            ).join('\n');
            
            // Generate analysis using the API
            fetch('/generate_analysis', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    transcript: formattedTranscript,
                    code: pythonCode
                })
            })
            .then(response => response.json())
            .then(data => {
                // Update the analysis content
                if (data.analysis) {
                    analysisContent.innerHTML = data.analysis;
                } else {
                    analysisContent.innerHTML = '<p>No analysis available.</p>';
                }
            })
            .catch(error => {
                console.error('Error generating analysis:', error);
                analysisContent.innerHTML = '<p>Error generating analysis. Please try again.</p>';
            });
        });
    </script>
</body>
</html>
