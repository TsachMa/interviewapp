<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .analysis-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .transcript-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: white;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .chat-message {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
        }
        
        .user-message {
            background-color: #e6f2ff;
            border-left: 3px solid #0d6efd;
        }
        
        .assistant-message {
            background-color: #f0f0f0;
            border-left: 3px solid #6c757d;
        }
        
        .analysis-section {
            background-color: #f8f9fa;
            border-left: 4px solid #198754;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .code-snapshot {
            background-color: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            overflow-x: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container analysis-container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Interview Analysis</h1>
            <div>
                <a href="/interviews" class="btn btn-outline-primary me-2">
                    <i class="bi bi-folder"></i> All Interviews
                </a>
                <a href="/" class="btn btn-outline-primary">
                    <i class="bi bi-arrow-left"></i> New Interview
                </a>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Performance Summary</h2>
            </div>
            <div class="card-body">
                <div class="analysis-section" id="analysisContent">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>Generating analysis...</p>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Final Code Submission</h2>
            </div>
            <div class="card-body">
                <pre class="code-snapshot" id="finalCode">Loading code...</pre>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Interview Transcript</h2>
            </div>
            <div class="card-body">
                <div class="transcript-container" id="fullTranscript">
                    <!-- Transcript messages will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fullTranscript = document.getElementById('fullTranscript');
            const analysisContent = document.getElementById('analysisContent');
            const finalCode = document.getElementById('finalCode');
            
            // Get the interview ID from the URL if present
            const pathParts = window.location.pathname.split('/');
            const interviewId = pathParts.length > 2 ? parseInt(pathParts[2]) : null;
            
            // Function to load chat history from either localStorage or database
            async function loadInterviewData() {
                if (interviewId) {
                    // Load from database
                    try {
                        const response = await fetch(`/get_interview/${interviewId}`);
                        const data = await response.json();
                        
                        if (data.success && data.interview) {
                            const interview = data.interview;
                            
                            // Display the code
                            finalCode.textContent = interview.code || 'No code available';
                            
                            // Display the transcript
                            if (interview.messages && interview.messages.length > 0) {
                                fullTranscript.innerHTML = '';
                                interview.messages.forEach(message => {
                                    const messageDiv = document.createElement('div');
                                    messageDiv.className = `chat-message ${message.role === 'user' ? 'user-message' : 'assistant-message'}`;
                                    
                                    // Create header with role and timestamp
                                    const header = document.createElement('div');
                                    header.className = 'message-header small text-muted';
                                    
                                    // Format the timestamp
                                    const timestamp = new Date(message.timestamp);
                                    const timeString = timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                    
                                    header.textContent = `${message.role === 'user' ? 'You' : 'Interviewer'} - ${timeString}`;
                                    
                                    // Create content
                                    const content = document.createElement('div');
                                    content.className = 'message-content';
                                    content.textContent = message.text;
                                    
                                    // Add header and content to message
                                    messageDiv.appendChild(header);
                                    messageDiv.appendChild(content);
                                    
                                    // Add message to transcript
                                    fullTranscript.appendChild(messageDiv);
                                });
                            } else {
                                fullTranscript.innerHTML = '<p>No transcript available.</p>';
                            }
                            
                            // Format transcript for analysis
                            const formattedTranscript = interview.messages ? 
                                interview.messages.map(msg => `${msg.role === 'user' ? 'User' : 'Interviewer'}: ${msg.text}`).join('\n') :
                                '';
                            
                            // If there's a saved analysis, use it
                            if (interview.analysis) {
                                analysisContent.innerHTML = interview.analysis;
                            } else {
                                // Generate analysis
                                generateAnalysis(formattedTranscript, interview.code, interviewId);
                            }
                        } else {
                            throw new Error('Interview not found');
                        }
                    } catch (error) {
                        console.error('Error loading interview:', error);
                        fullTranscript.innerHTML = '<p>Error loading interview data.</p>';
                        finalCode.textContent = 'Error loading code';
                        analysisContent.innerHTML = '<p>Error: Could not load interview data for analysis.</p>';
                    }
                } else {
                    // Load from localStorage (existing implementation)
                    const chatHistory = JSON.parse(localStorage.getItem('interviewChatHistory') || '[]');
                    const pythonCode = localStorage.getItem('pythonCode') || '';
                    
                    // Display the Python code
                    finalCode.textContent = pythonCode;
                    
                    // Display the transcript
                    if (chatHistory && chatHistory.length > 0) {
                        fullTranscript.innerHTML = '';
                        chatHistory.forEach(message => {
                            const messageDiv = document.createElement('div');
                            messageDiv.className = `chat-message ${message.role === 'user' ? 'user-message' : 'assistant-message'}`;
                            
                            // Create header with role and timestamp
                            const header = document.createElement('div');
                            header.className = 'message-header small text-muted';
                            
                            // Format the timestamp
                            const timestamp = new Date(message.timestamp);
                            const timeString = timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                            
                            header.textContent = `${message.role === 'user' ? 'You' : 'Interviewer'} - ${timeString}`;
                            
                            // Create content
                            const content = document.createElement('div');
                            content.className = 'message-content';
                            content.textContent = message.text;
                            
                            // Add header and content to message
                            messageDiv.appendChild(header);
                            messageDiv.appendChild(content);
                            
                            // Add message to transcript
                            fullTranscript.appendChild(messageDiv);
                        });
                    } else {
                        fullTranscript.innerHTML = '<p>No transcript available.</p>';
                    }
                    
                    // Format the transcript for sending to the API
                    const formattedTranscript = chatHistory.map(msg => 
                        `${msg.role === 'user' ? 'User' : 'Interviewer'}: ${msg.text}`
                    ).join('\n');
                    
                    // Generate analysis
                    generateAnalysis(formattedTranscript, pythonCode);
                }
            }
            
            // Function to generate analysis
            async function generateAnalysis(transcript, code, interview_id = null) {
                try {
                    // Check if we already have an analysis from the database
                    if (interview_id) {
                        const response = await fetch(`/get_interview/${interviewId}`);
                        const data = await response.json();
                        
                        if (data.success && data.interview.analysis) {
                            analysisContent.innerHTML = data.interview.analysis;
                            return; // Exit early if we already have an analysis
                        }
                    }
                    
                    const response = await fetch('/generate_analysis', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            transcript: transcript,
                            code: code,
                            interview_id: interview_id
                        })
                    });
                    
                    const data = await response.json();
                    
                    // Update the analysis content
                    if (data.analysis) {
                        analysisContent.innerHTML = data.analysis;
                        
                        // If we have an interview_id, save the summary to the database
                        if (interview_id) {
                            try {
                                await fetch(`/update_interview_summary/${interview_id}`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({ 
                                        summary: data.analysis
                                    })
                                });
                            } catch (error) {
                                console.error('Error saving summary:', error);
                            }
                        }
                    } else {
                        analysisContent.innerHTML = '<p>No analysis available.</p>';
                    }
                }
                catch (error) {
                    console.error('Error generating analysis:', error);
                    analysisContent.innerHTML = '<p>Error generating analysis. Please try again.</p>';
                }
            }
            
            // Start loading the interview data
            loadInterviewData();
        });
    </script>
</body>
</html>
