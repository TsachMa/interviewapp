<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center">
                        <h1 class="hello-text">Hello!</h1>
                        <p class="lead">Welcome to the interview!</p>
                        <!-- added a new button with ID recordButton --> 
                        <!-- red Boostrap button with top margin-->
                        
                        <button id="recordButton" class="btn btn-danger mt-3">
                            <!-- added a microphone icon from Bootstrap Icons -->
                            <i class="bi bi-mic-fill"></i> Record Audio
                        </button>
                        <!-- added a div with ID transcriptionResult -->
                        <!-- class mt-3 to add top margin -->
                        <div id="transcriptionResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
