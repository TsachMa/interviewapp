<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Add Highlight.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Left Sidebar -->
            <div class="col-md-3 p-3 sidebar">
                <h3>Interview Controls</h3>
                <button id="recordButton" class="btn btn-primary w-100 mb-3">
                    <i class="bi bi-mic-fill"></i> Record Audio
                </button>
                <div id="transcriptionResult" class="mb-3 p-2 bg-light rounded"></div>
            </div>
            
            <!-- Center Code Pane -->
            <div class="col-md-9 p-3">
                <div class="card">
                    <div class="card-header">
                        <h4>Code Editor</h4>
                    </div>
                    <div class="card-body">
                        <div id="editor-container" class="mb-2 border rounded">
                            <pre><code id="highlighting-content" class="language-python"></code></pre>
                            <textarea id="pythonCode" class="form-control" rows="15" placeholder="Enter Python code here"></textarea>
                        </div>
                        <button id="executeButton" class="btn btn-primary">Execute Python</button>
                        <div id="executionResult" class="mt-2 p-2 bg-light"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Add Highlight.js script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <!-- Add Python language support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/python.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
